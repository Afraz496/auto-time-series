name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest --cov=omnicast --cov-report=term-missing

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --extra docs

      - name: Test docs build
        run: uv run pytest tests/test_docs.py -v

      - name: Build docs
        run: uv run sphinx-build -b html docs docs/_build/html -W --keep-going

  test-torch:
    # Separate job: the torch extra is a large download, so it runs once on
    # a single Python version rather than in the main version matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --extra torch

      - name: Test
        run: uv run pytest --cov=omnicast --cov-report=term-missing

      - name: Doctest model docstring examples
        run: uv run pytest --doctest-modules src/omnicast
